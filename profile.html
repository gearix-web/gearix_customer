<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โปรไฟล์ลูกค้า | Gearix</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/customer.css">
</head>
<body>

<!-- Top bar -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-mark">
      <i class="bi bi-gear-fill gear-icon"></i>
      <span class="name">Gearix</span>
      <span class="sub">Customer Profile</span>
    </div>
    <div class="topbar-right">
      <a class="btn-ghost-light" href="index.html">
        <i class="bi bi-house-door"></i> หน้าหลัก
      </a>
      <button id="logoutBtn" class="btn-ghost-light">
        <i class="bi bi-box-arrow-right"></i> ออกจากระบบ
      </button>
    </div>
  </div>
</header>

<main class="shell">

  <div class="panel" style="max-width:640px;margin:0 auto;">
    <div class="panel-heading">
      <span><i class="bi bi-person-lines-fill"></i> โปรไฟล์ของฉัน</span>
    </div>

    <div id="profileLoading" class="empty-row" style="padding:2rem;text-align:center;color:var(--slate);">
      <i class="bi bi-hourglass-split"></i> กำลังโหลดข้อมูล...
    </div>

    <form id="profileForm" style="display:none;">
      <div class="mb-3">
        <label class="form-label fw-semibold">ชื่อ-นามสกุล</label>
        <input type="text" id="pfName" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">เบอร์โทร</label>
        <input type="text" id="pfPhone" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" id="pfEmail" class="form-control" readonly>
        <small class="text-muted">อีเมลใช้สำหรับเข้าสู่ระบบเท่านั้น ไม่สามารถแก้ไขได้</small>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">ที่อยู่</label>
        <textarea id="pfAddress" class="form-control" rows="3" placeholder="ที่อยู่สำหรับติดต่อ/รับเครื่อง"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">รายละเอียดเพิ่มเติม</label>
        <textarea id="pfDetails" class="form-control" rows="3" placeholder="ข้อมูลอื่น ๆ เช่น สถานที่สะดวกรับงาน, หมายเหตุ..."></textarea>
      </div>

      <button type="submit" class="btn-industrial orange w-100">
        <i class="bi bi-check-lg"></i> บันทึกข้อมูล
      </button>
    </form>

    <div id="profileSaved" class="ind-toast" style="left:50%;"></div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module">
import { auth, db } from "./js/firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

let profileUid = null;

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  getDoc(doc(db, "users", user.uid)).then((snap) => {
    if (!snap.exists() || snap.data().role !== "customer") {
      window.location.href = "login.html";
      return;
    }
    profileUid = user.uid;
    const d = snap.data();
    document.getElementById("pfName").value = d.fullname || "";
    document.getElementById("pfPhone").value = d.phone || "";
    document.getElementById("pfEmail").value = d.email || "";
    document.getElementById("pfAddress").value = d.address || "";
    document.getElementById("pfDetails").value = d.details || "";
    document.getElementById("profileLoading").style.display = "none";
    document.getElementById("profileForm").style.display = "block";
  }).catch((err) => {
    console.error("[โหลดโปรไฟล์ไม่สำเร็จ]", err);
    document.getElementById("profileLoading").innerHTML =
      `<i class="bi bi-exclamation-triangle"></i> โหลดไม่สำเร็จ (${err.code || err.message})`;
  });
});

document.getElementById("profileForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!profileUid) return;

  try {
    await updateDoc(doc(db, "users", profileUid), {
      fullname: document.getElementById("pfName").value.trim(),
      phone: document.getElementById("pfPhone").value.trim(),
      address: document.getElementById("pfAddress").value.trim(),
      details: document.getElementById("pfDetails").value.trim(),
      updatedAt: serverTimestamp()
    });
    Swal.fire({ icon: "success", title: "บันทึกเรียบร้อย", timer: 1200, showConfirmButton: false });
  } catch (err) {
    console.error("[บันทึกโปรไฟล์ไม่สำเร็จ]", err);
    Swal.fire({ icon: "error", title: "บันทึกไม่สำเร็จ", text: err.code || err.message });
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  const result = await Swal.fire({
    title: "ออกจากระบบ?",
    icon: "question",
    showCancelButton: true,
    confirmButtonText: "ออกจากระบบ",
    cancelButtonText: "ยกเลิก"
  });
  if (result.isConfirmed) {
    await signOut(auth);
    window.location.href = "index.html";
  }
});
</script>

</body>
</html>
